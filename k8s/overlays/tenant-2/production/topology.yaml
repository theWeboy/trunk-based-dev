apiVersion: apps/v1
kind: Deployment
metadata:
  name: trunk-api
spec:
  template:
    spec:
      topologySpreadConstraints:
        # Hard: one pod per node at most. Prevents a single node failure from
        # taking down all replicas. Requires ≥3 schedulable nodes in production.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: trunk-api
        # Soft: prefer spreading across AZs. Never blocks scheduling.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: trunk-api
---
