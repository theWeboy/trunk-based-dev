apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trunk-dev-tenant-2
resources:
  - namespace.yaml
  - configmap.yaml
  - ../../../base/api
  - ../../../base/orders
  - ../../../base/notifications
  - ../../../base/payments
commonLabels:
  tenant: tenant-2
  environment: dev
  cloud: gcp
# Placeholder tags — overwritten by `kustomize edit set image` in deploy-dev.yml before kubectl apply.
# Built services receive the new SHA tag; unchanged services preserve the currently-deployed image.
images:
  - name: trunk-api:latest
    newTag: set-by-deploy-workflow
  - name: trunk-notifications:latest
    newTag: set-by-deploy-workflow
  - name: trunk-orders:latest
    newTag: set-by-deploy-workflow
  - name: trunk-payments:latest
    newTag: set-by-deploy-workflow
