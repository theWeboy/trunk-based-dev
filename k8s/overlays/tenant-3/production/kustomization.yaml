apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trunk-production-tenant-3
resources:
  - namespace.yaml
  - configmap.yaml
  - ../../../base/rbac
  - ../../../base/api
  - ../../../base/orders
  - ../../../base/notifications
  - ../../../base/payments
  - pdb.yaml
commonLabels:
  tenant: tenant-3
  environment: production
  cloud: gcp
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
  - path: topology.yaml
# Placeholder tags — overwritten by `kustomize edit set image` in deploy-production.yml before kubectl apply.
# Built services receive the versioned tag (v<semver>); unchanged services preserve the currently-deployed image.
images:
  - name: trunk-api:latest
    newTag: set-by-deploy-workflow
  - name: trunk-notifications:latest
    newTag: set-by-deploy-workflow
  - name: trunk-orders:latest
    newTag: set-by-deploy-workflow
  - name: trunk-payments:latest
    newTag: set-by-deploy-workflow
