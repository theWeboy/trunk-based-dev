apiVersion: batch/v1
kind: Job
metadata:
  name: trunk-api-migrate
  labels:
    app: trunk-api
    type: migration
    project: trunk
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: trunk-service-account
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
      initContainers:
        - name: database-check
          image: busybox:1.36
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - |
              if [ -z "$DATABASE_URL" ]; then
                echo "DATABASE_URL not set — skipping database check"
                exit 0
              fi
              STRIPPED=$(echo "$DATABASE_URL" | sed 's|.*@||')
              DB_HOST=$(echo "$STRIPPED" | cut -d: -f1)
              DB_PORT=$(echo "$STRIPPED" | cut -d: -f2 | cut -d'/' -f1)
              DB_PORT=${DB_PORT:-5432}
              exec /wait-scripts/wait-for-tcp.sh \
                Database \
                "$DB_HOST" \
                "$DB_PORT" \
                "check DATABASE_URL and network" \
                "120" \
                "2" \
                "3"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trunk-db-secret
                  key: DATABASE_URL
                  optional: true
          volumeMounts:
            - name: init-scripts
              mountPath: /wait-scripts
              readOnly: true
      containers:
        - name: migrate
          image: trunk-api:latest
          imagePullPolicy: Always
          command: ["bun", "run", "db:migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: trunk-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trunk-db-secret
                  key: DATABASE_URL
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: init-scripts
          configMap:
            name: trunk-api-init-scripts
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
