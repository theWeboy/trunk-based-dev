# Deploy to Dev. Runs on push to main or workflow_dispatch.
# tenant = tenant-1 | tenant-2 | tenant-3 | all. Builds only changed services;
# changes in shared/ or root deps trigger a full multi-service rebuild.
name: Deploy to Dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (default main)"
        required: false
        default: "main"
      tenant:
        description: "Target tenant: tenant-1, tenant-2, tenant-3, or all"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - tenant-1
          - tenant-2
          - tenant-3
      run_migrations:
        description: "Force run database migrations (even if no migration files changed)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-dev-${{ github.event_name == 'workflow_dispatch' && inputs.tenant || 'all' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ALL_SERVICES: "api orders notifications payments"

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services_list: ${{ steps.list.outputs.list }}
      migrations_changed: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'workflow_dispatch' && 'HEAD^' || '' }}
          filters: |
            api: 'services/api/**'
            orders: 'services/orders/**'
            notifications: 'services/notifications/**'
            payments: 'services/payments/**'
            migrations: 'migrations/**'
            shared: |
              shared/**
              encore.app
              package.json
              bun.lock
              bunfig.toml

      - id: list
        run: |
          if [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            echo "list=${{ env.ALL_SERVICES }}" >> $GITHUB_OUTPUT
            echo "Building all services (shared or root deps changed)"
          else
            SVCS=""
            [ "${{ steps.filter.outputs.api }}" = "true" ] && SVCS="$SVCS api"
            [ "${{ steps.filter.outputs.orders }}" = "true" ] && SVCS="$SVCS orders"
            [ "${{ steps.filter.outputs.notifications }}" = "true" ] && SVCS="$SVCS notifications"
            [ "${{ steps.filter.outputs.payments }}" = "true" ] && SVCS="$SVCS payments"
            SVCS="${SVCS# }"
            if [ -z "$SVCS" ]; then
              echo "list=${{ env.ALL_SERVICES }}" >> $GITHUB_OUTPUT
              echo "No service paths changed; building all"
            else
              echo "list=$SVCS" >> $GITHUB_OUTPUT
              echo "Building changed services: $SVCS"
            fi
          fi

  setup-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          T="${{ github.event_name == 'workflow_dispatch' && inputs.tenant || 'all' }}"
          if [ "$T" = "all" ]; then
            echo 'matrix=[{"tenant":"tenant-1","cloud":"aws"},{"tenant":"tenant-2","cloud":"gcp"},{"tenant":"tenant-3","cloud":"gcp"}]' >> $GITHUB_OUTPUT
          elif [ "$T" = "tenant-1" ]; then
            echo 'matrix=[{"tenant":"tenant-1","cloud":"aws"}]' >> $GITHUB_OUTPUT
          elif [ "$T" = "tenant-2" ]; then
            echo 'matrix=[{"tenant":"tenant-2","cloud":"gcp"}]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=[{"tenant":"tenant-3","cloud":"gcp"}]' >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: [detect-changes, setup-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Version and SHA
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "git_sha=$SHA" >> $GITHUB_OUTPUT
          echo "Dev image tag: ${SHA}"

      - name: Configure AWS (tenant-1)
        if: matrix.tenant == 'tenant-1'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN_TENANT_1 }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR (tenant-1)
        if: matrix.tenant == 'tenant-1'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY_TENANT_1 }}

      - name: Authenticate to GCP (tenant-2)
        if: matrix.tenant == 'tenant-2'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_2 }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_TENANT_2 }}

      - name: Authenticate to GCP (tenant-3)
        if: matrix.tenant == 'tenant-3'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_3 }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_TENANT_3 }}

      - name: Set up Cloud SDK (tenant-2 or tenant-3)
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GAR (tenant-2)
        if: matrix.tenant == 'tenant-2'
        run: gcloud auth configure-docker ${{ secrets.GAR_REGISTRY_TENANT_2 }} --quiet

      - name: Configure Docker for GAR (tenant-3)
        if: matrix.tenant == 'tenant-3'
        run: gcloud auth configure-docker ${{ secrets.GAR_REGISTRY_TENANT_3 }} --quiet

      - name: Cache node_modules and Encore build cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .encore
          key: ${{ runner.os }}-encore-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-encore-

      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile

      - name: Build and push dev images
        run: |
          SHA="${{ steps.meta.outputs.git_sha }}"
          TENANT="${{ matrix.tenant }}"
          [ "$TENANT" = "tenant-1" ] && INFRA_CONFIG="k8s/encore/infra.staging.json" || INFRA_CONFIG="k8s/encore/infra.staging.gcp.json"

          if [ "$TENANT" = "tenant-1" ]; then
            REGISTRY="${{ secrets.ECR_REGISTRY_TENANT_1 }}"
            BASE="${REGISTRY}/dhi-runtime-node:22-slim"
          elif [ "$TENANT" = "tenant-2" ]; then
            REGISTRY="${{ secrets.GAR_REGISTRY_TENANT_2 }}"
            BASE="${REGISTRY}/dhi-runtime-node:22-slim"
          else
            REGISTRY="${{ secrets.GAR_REGISTRY_TENANT_3 }}"
            BASE="${REGISTRY}/dhi-runtime-node:22-slim"
          fi
          for SVC in ${{ needs.detect-changes.outputs.services_list }}; do
            REPO="${REGISTRY}/trunk-${SVC}-dev-${TENANT}"
            encore build docker "${REPO}:${SHA}" --services="${SVC}" --base="${BASE}" --config="${INFRA_CONFIG}"
            docker push "${REPO}:${SHA}"
          done
          echo "Pushed ${TENANT} dev tags for: ${{ needs.detect-changes.outputs.services_list }} (${SHA})"

      - name: Trivy image scan (non-blocking for dev)
        run: |
          SHA="${{ steps.meta.outputs.git_sha }}"
          TENANT="${{ matrix.tenant }}"
          if [ "$TENANT" = "tenant-1" ]; then
            REGISTRY="${{ secrets.ECR_REGISTRY_TENANT_1 }}"
          elif [ "$TENANT" = "tenant-2" ]; then
            REGISTRY="${{ secrets.GAR_REGISTRY_TENANT_2 }}"
          else
            REGISTRY="${{ secrets.GAR_REGISTRY_TENANT_3 }}"
          fi
          VULN_FOUND=0
          for SVC in ${{ needs.detect-changes.outputs.services_list }}; do
            IMG="${REGISTRY}/trunk-${SVC}-dev-${TENANT}:${SHA}"
            echo "Scanning ${IMG}..."
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 1 "${IMG}" || VULN_FOUND=1
          done
          if [ "$VULN_FOUND" -eq 1 ]; then
            echo "::warning::Trivy found CRITICAL/HIGH vulnerabilities in dev images. Review before promoting to sandbox."
          fi

  deploy:
    needs: [setup-matrix, build-and-push, detect-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-${{ matrix.tenant }}
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
      fail-fast: false
    env:
      NS: trunk-dev-${{ matrix.tenant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Resolve SHA and services
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "services_list=${{ needs.detect-changes.outputs.services_list }}" >> $GITHUB_OUTPUT
          echo "Deploying SHA $SHA for services: ${{ needs.detect-changes.outputs.services_list }}"

      - name: Configure AWS (tenant-1)
        if: matrix.tenant == 'tenant-1'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN_TENANT_1 }}
          aws-region: ${{ env.AWS_REGION }}

      - name: kubeconfig (tenant-1 EKS)
        if: matrix.tenant == 'tenant-1'
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_DEV_TENANT_1 }} --region ${{ env.AWS_REGION }}

      - name: Authenticate to GCP (tenant-2)
        if: matrix.tenant == 'tenant-2'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_2 }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_TENANT_2 }}

      - name: Authenticate to GCP (tenant-3)
        if: matrix.tenant == 'tenant-3'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_3 }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_TENANT_3 }}

      - name: Set up gcloud (tenant-2 or tenant-3)
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@v2

      - name: kubeconfig (tenant-2 GKE)
        if: matrix.tenant == 'tenant-2'
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME_DEV_TENANT_2 }} \
            --region ${{ secrets.GKE_REGION_TENANT_2 || 'us-central1' }}

      - name: kubeconfig (tenant-3 GKE)
        if: matrix.tenant == 'tenant-3'
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME_DEV_TENANT_3 }} \
            --region ${{ secrets.GKE_REGION_TENANT_3 || 'europe-west1' }}

      - name: Inject image tags & apply overlay
        run: |
          SHA="${{ steps.meta.outputs.sha }}"
          TENANT="${{ matrix.tenant }}"
          BUILT_SVCS="${{ steps.meta.outputs.services_list }}"
          ALL_SVCS="${{ env.ALL_SERVICES }}"
          NS="${{ env.NS }}"
          if [ "$TENANT" = "tenant-1" ]; then
            REGISTRY="${{ secrets.ECR_REGISTRY_TENANT_1 }}"
          elif [ "$TENANT" = "tenant-2" ]; then
            REGISTRY="${{ secrets.GAR_REGISTRY_TENANT_2 }}"
          else
            REGISTRY="${{ secrets.GAR_REGISTRY_TENANT_3 }}"
          fi

          # Inject image tags into the kustomization before applying.
          # Built services get the new SHA tag. Services not rebuilt preserve the
          # currently-deployed image so the apply is a no-op for those pods.
          for SVC in $ALL_SVCS; do
            if echo "$BUILT_SVCS" | grep -qw "$SVC"; then
              (cd k8s/overlays/${TENANT}/dev && \
                kustomize edit set image "trunk-${SVC}:latest=${REGISTRY}/trunk-${SVC}-dev-${TENANT}:${SHA}")
            else
              CURRENT_IMG=$(kubectl get deployment "trunk-${SVC}" -n "${NS}" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
              if [ -n "$CURRENT_IMG" ]; then
                (cd k8s/overlays/${TENANT}/dev && \
                  kustomize edit set image "trunk-${SVC}:latest=${CURRENT_IMG}")
              fi
            fi
          done

          kubectl apply -k k8s/overlays/${TENANT}/dev --server-side=true 2>/dev/null \
            || kubectl apply -k k8s/overlays/${TENANT}/dev

      - name: Run database migrations (conditional)
        if: needs.detect-changes.outputs.migrations_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_migrations == true)
        run: |
          kubectl delete job trunk-api-migrate -n ${{ env.NS }} --ignore-not-found
          kubectl apply -k k8s/overlays/${{ matrix.tenant }}/dev -l type=migration --server-side=true 2>/dev/null \
            || kubectl apply -k k8s/overlays/${{ matrix.tenant }}/dev -l type=migration

          kubectl wait --for=condition=complete job/trunk-api-migrate -n ${{ env.NS }} --timeout=120s || \
            (echo "Migration job failed or timed out"; kubectl logs job/trunk-api-migrate -n ${{ env.NS }}; exit 1)

      - name: Wait for rollout
        run: |
          SVCS="${{ steps.meta.outputs.services_list }}"
          for SVC in $SVCS; do
            if kubectl get deployment "trunk-${SVC}" -n ${{ env.NS }} 2>/dev/null; then
              kubectl rollout status deployment/trunk-${SVC} -n ${{ env.NS }} --timeout=5m
            fi
          done

      - name: Smoke test (with retries)
        run: |
          kubectl port-forward -n "${{ env.NS }}" deployment/trunk-api 4000:4000 &
          PF_PID=$!
          PASSED=false
          for i in 1 2 3 4 5; do
            sleep 5
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:4000/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (HTTP 200) on attempt $i"
              PASSED=true
              break
            fi
            echo "Attempt $i: HTTP $HTTP_CODE — retrying..."
          done
          kill $PF_PID 2>/dev/null || true
          if [ "$PASSED" = "false" ]; then
            echo "::warning::Dev smoke test failed after 5 attempts (non-fatal)"
          fi

      - name: Deploy summary
        run: |
          echo "Deployed to ${{ env.NS }} (tenant=${{ matrix.tenant }})"
          echo "SHA: ${{ steps.meta.outputs.sha }}"
          echo "Services updated: ${{ steps.meta.outputs.services_list }}"
