# Runs E2E tests from the PR context when the PR has the `run-e2e` label.
# This ensures the workflow file and checked-out code come from the PR branch,
# not the default branch issue_comment context.
name: E2E Tests

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to run E2E against'
        required: false
        type: string

concurrency:
  group: e2e-${{ github.event.pull_request.number || inputs.pr_number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  e2e:
    if: |
      github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve target revision
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const prNumberRaw = '${{ inputs.pr_number }}'.trim();
              if (prNumberRaw) {
                const pull_number = Number(prNumberRaw);
                if (!Number.isInteger(pull_number) || pull_number <= 0) {
                  core.setFailed(`Invalid pr_number input: ${prNumberRaw}`);
                  return;
                }

                const pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number,
                });

                core.setOutput('sha', pr.data.head.sha);
                core.setOutput('head_repo', pr.data.head.repo.full_name);
                core.setOutput('pr_number', String(pull_number));
                return;
              }

              core.setOutput('sha', context.sha);
              core.setOutput('head_repo', `${context.repo.owner}/${context.repo.repo}`);
              core.setOutput('pr_number', '');
              return;
            }

            core.setOutput('sha', '${{ github.event.pull_request.head.sha }}');
            core.setOutput('head_repo', '${{ github.event.pull_request.head.repo.full_name }}');
            core.setOutput('pr_number', '${{ github.event.pull_request.number }}');

      - name: Set E2E status to in-progress
        if: steps.target.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.target.outputs.sha }}',
              state: 'pending',
              context: 'E2E Tests',
              description: 'Running E2E tests...'
            });

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.target.outputs.head_repo }}
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Verify PR head checkout
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ steps.target.outputs.sha }}"
          echo "Checked out SHA: ${ACTUAL_SHA}"
          echo "Expected PR SHA: ${EXPECTED_SHA}"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked out commit does not match the PR head SHA"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Run E2E tests
        id: e2e-tests
        continue-on-error: true
        run: bun run test:e2e

      - name: Update E2E commit status
        if: always() && steps.target.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.e2e-tests.outcome }}';
            const passed = outcome === 'success';
            const cancelled = outcome === 'cancelled';
            const state = passed ? 'success' : 'failure';
            const description = passed
              ? 'E2E tests passed'
              : cancelled
                ? 'E2E job cancelled or timed out'
                : 'E2E tests failed — fix and re-run /run-e2e';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.target.outputs.sha }}',
              state,
              context: 'E2E Tests',
              description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!passed) core.setFailed('E2E tests failed');
