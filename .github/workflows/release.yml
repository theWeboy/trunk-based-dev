# Creates/updates "Version Packages" PR when there are pending changesets on main.
# Merging that PR bumps package.json and CHANGELOG.md only — no git tag.
# The git tag and GitHub Release are created only after production deploy (see deploy-production.yml).
#
# Automatic push-to-main is disabled initially; run "Release (Version Packages)" manually from Actions
# when you want to open/update the Version Packages PR. Re-enable push below when ready.
name: Release (Version Packages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Create or update Version Packages PR
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          title: "Version Packages"
          commit: "chore: version packages"
          # Do not run publish (no npm publish, no git tag). Tag is created after prod deploy.
          publish: "echo 'Tag and GitHub Release are created after production deploy.'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
