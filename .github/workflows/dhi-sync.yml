# Mirror Docker Hardened Images (DHI) base image from dhi.io to all three tenant registries:
#   tenant-1: AWS ECR (us-east-1)
#   tenant-2: GCP Artifact Registry (us-central1)
#   tenant-3: GCP Artifact Registry (europe-west1)
#
# Run manually or weekly (Sunday 02:00 UTC). Uses regctl image copy
# (manifest-level transfer, no rebuild). See regsync.yaml for config reference.
#
# Required secrets:
#   DHI_REGISTRY_USERNAME, DHI_REGISTRY_PASSWORD (or DHI_REGISTRY_TOKEN)
#   GH_ACTIONS_ROLE_ARN_TENANT_1, ECR_REGISTRY_TENANT_1
#   GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_2, GCP_SERVICE_ACCOUNT_EMAIL_TENANT_2, GAR_REGISTRY_TENANT_2
#   GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_3, GCP_SERVICE_ACCOUNT_EMAIL_TENANT_3, GAR_REGISTRY_TENANT_3
#
# Flow:
#   dhi.io/node:22-slim  ──regctl copy──►  tenant-1 ECR
#                         ──regctl copy──►  tenant-2 GAR
#                         ──regctl copy──►  tenant-3 GAR
#
# Deploy workflows then use --base=<registry>/dhi-runtime-node:22-slim
# in `encore build docker` so every service image inherits the hardened base.
name: DHI Base Image Sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * 0"  # Weekly Sunday 02:00 UTC

permissions:
  id-token: write
  contents: read

env:
  DHI_IMAGE: "dhi.io/node:22-slim"

jobs:
  sync-tenant-1:
    name: Mirror to ECR (tenant-1 / AWS)
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.precheck.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6

      - name: Check required secrets (tenant-1)
        id: precheck
        env:
          DHI_REGISTRY_TOKEN: ${{ secrets.DHI_REGISTRY_TOKEN }}
          DHI_REGISTRY_USERNAME: ${{ secrets.DHI_REGISTRY_USERNAME }}
          DHI_REGISTRY_PASSWORD: ${{ secrets.DHI_REGISTRY_PASSWORD }}
          GH_ACTIONS_ROLE_ARN_TENANT_1: ${{ secrets.GH_ACTIONS_ROLE_ARN_TENANT_1 }}
          ECR_REGISTRY_TENANT_1: ${{ secrets.ECR_REGISTRY_TENANT_1 }}
          AWS_REGION_TENANT_1: ${{ secrets.AWS_REGION_TENANT_1 }}
        run: |
          HAS_DHI_CREDS=false
          if [ -n "$DHI_REGISTRY_TOKEN" ] || { [ -n "$DHI_REGISTRY_USERNAME" ] && [ -n "$DHI_REGISTRY_PASSWORD" ]; }; then
            HAS_DHI_CREDS=true
          fi

          if [ "$HAS_DHI_CREDS" = true ] && [ -n "$GH_ACTIONS_ROLE_ARN_TENANT_1" ] && [ -n "$ECR_REGISTRY_TENANT_1" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping tenant-1 DHI sync because one or more required GitHub secrets are missing."
          fi

      - name: Install regctl
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          curl -sSL "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64" -o regctl
          chmod +x regctl
          sudo mv regctl /usr/local/bin/
          regctl version

      - name: Login to DHI registry (dhi.io)
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          if [ -n "${{ secrets.DHI_REGISTRY_TOKEN }}" ]; then
            echo "${{ secrets.DHI_REGISTRY_TOKEN }}" | regctl registry login dhi.io --user '' --pass-stdin
          else
            regctl registry login dhi.io --user "${{ secrets.DHI_REGISTRY_USERNAME }}" --pass "${{ secrets.DHI_REGISTRY_PASSWORD }}"
          fi

      - name: Configure AWS credentials (tenant-1)
        if: steps.precheck.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN_TENANT_1 }}
          aws-region: ${{ secrets.AWS_REGION_TENANT_1 || 'us-east-1' }}

      - name: Login to ECR
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION_TENANT_1 || 'us-east-1' }} | \
          regctl registry login ${{ secrets.ECR_REGISTRY_TENANT_1 }} --user AWS --pass-stdin

      - name: Copy DHI image to ECR (tenant-1)
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          ECR_TARGET="${{ secrets.ECR_REGISTRY_TENANT_1 }}/dhi-runtime-node:22-slim"
          regctl image copy ${{ env.DHI_IMAGE }} "$ECR_TARGET"
          echo "Mirrored dhi.io/node:22-slim → ECR (tenant-1)"

  sync-tenant-2:
    name: Mirror to Artifact Registry (tenant-2 / GCP us-central1)
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.precheck.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6

      - name: Check required secrets (tenant-2)
        id: precheck
        env:
          DHI_REGISTRY_TOKEN: ${{ secrets.DHI_REGISTRY_TOKEN }}
          DHI_REGISTRY_USERNAME: ${{ secrets.DHI_REGISTRY_USERNAME }}
          DHI_REGISTRY_PASSWORD: ${{ secrets.DHI_REGISTRY_PASSWORD }}
          GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_2: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_2 }}
          GCP_SERVICE_ACCOUNT_EMAIL_TENANT_2: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_TENANT_2 }}
          GAR_REGISTRY_TENANT_2: ${{ secrets.GAR_REGISTRY_TENANT_2 }}
        run: |
          HAS_DHI_CREDS=false
          if [ -n "$DHI_REGISTRY_TOKEN" ] || { [ -n "$DHI_REGISTRY_USERNAME" ] && [ -n "$DHI_REGISTRY_PASSWORD" ]; }; then
            HAS_DHI_CREDS=true
          fi

          if [ "$HAS_DHI_CREDS" = true ] && [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_2" ] && [ -n "$GCP_SERVICE_ACCOUNT_EMAIL_TENANT_2" ] && [ -n "$GAR_REGISTRY_TENANT_2" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping tenant-2 DHI sync because one or more required GitHub secrets are missing."
          fi

      - name: Install regctl
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          curl -sSL "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64" -o regctl
          chmod +x regctl
          sudo mv regctl /usr/local/bin/
          regctl version

      - name: Login to DHI registry (dhi.io)
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          if [ -n "${{ secrets.DHI_REGISTRY_TOKEN }}" ]; then
            echo "${{ secrets.DHI_REGISTRY_TOKEN }}" | regctl registry login dhi.io --user '' --pass-stdin
          else
            regctl registry login dhi.io --user "${{ secrets.DHI_REGISTRY_USERNAME }}" --pass "${{ secrets.DHI_REGISTRY_PASSWORD }}"
          fi

      - name: Authenticate to GCP (tenant-2)
        if: steps.precheck.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_2 }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_TENANT_2 }}

      - name: Set up Cloud SDK
        if: steps.precheck.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.precheck.outputs.enabled == 'true'
        run: gcloud auth configure-docker ${{ secrets.GAR_REGISTRY_TENANT_2 }} --quiet

      - name: Copy DHI image to GAR (tenant-2)
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          GAR_TARGET="${{ secrets.GAR_REGISTRY_TENANT_2 }}/dhi-runtime-node:22-slim"
          regctl image copy ${{ env.DHI_IMAGE }} "$GAR_TARGET"
          echo "Mirrored dhi.io/node:22-slim → GAR (tenant-2)"

  sync-tenant-3:
    name: Mirror to Artifact Registry (tenant-3 / GCP europe-west1)
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.precheck.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6

      - name: Check required secrets (tenant-3)
        id: precheck
        env:
          DHI_REGISTRY_TOKEN: ${{ secrets.DHI_REGISTRY_TOKEN }}
          DHI_REGISTRY_USERNAME: ${{ secrets.DHI_REGISTRY_USERNAME }}
          DHI_REGISTRY_PASSWORD: ${{ secrets.DHI_REGISTRY_PASSWORD }}
          GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_3: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_3 }}
          GCP_SERVICE_ACCOUNT_EMAIL_TENANT_3: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_TENANT_3 }}
          GAR_REGISTRY_TENANT_3: ${{ secrets.GAR_REGISTRY_TENANT_3 }}
        run: |
          HAS_DHI_CREDS=false
          if [ -n "$DHI_REGISTRY_TOKEN" ] || { [ -n "$DHI_REGISTRY_USERNAME" ] && [ -n "$DHI_REGISTRY_PASSWORD" ]; }; then
            HAS_DHI_CREDS=true
          fi

          if [ "$HAS_DHI_CREDS" = true ] && [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_3" ] && [ -n "$GCP_SERVICE_ACCOUNT_EMAIL_TENANT_3" ] && [ -n "$GAR_REGISTRY_TENANT_3" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping tenant-3 DHI sync because one or more required GitHub secrets are missing."
          fi

      - name: Install regctl
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          curl -sSL "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64" -o regctl
          chmod +x regctl
          sudo mv regctl /usr/local/bin/

      - name: Login to DHI registry (dhi.io)
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          if [ -n "${{ secrets.DHI_REGISTRY_TOKEN }}" ]; then
            echo "${{ secrets.DHI_REGISTRY_TOKEN }}" | regctl registry login dhi.io --user '' --pass-stdin
          else
            regctl registry login dhi.io --user "${{ secrets.DHI_REGISTRY_USERNAME }}" --pass "${{ secrets.DHI_REGISTRY_PASSWORD }}"
          fi

      - name: Authenticate to GCP (tenant-3)
        if: steps.precheck.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TENANT_3 }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_TENANT_3 }}

      - name: Set up Cloud SDK
        if: steps.precheck.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.precheck.outputs.enabled == 'true'
        run: gcloud auth configure-docker ${{ secrets.GAR_REGISTRY_TENANT_3 }} --quiet

      - name: Copy DHI image to GAR (tenant-3)
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          GAR_TARGET="${{ secrets.GAR_REGISTRY_TENANT_3 }}/dhi-runtime-node:22-slim"
          regctl image copy ${{ env.DHI_IMAGE }} "$GAR_TARGET"
          echo "Mirrored dhi.io/node:22-slim → GAR (tenant-3)"

  verify:
    name: Verify sync
    needs: [sync-tenant-1, sync-tenant-2, sync-tenant-3]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "DHI base image (Docker Hardened Images) dhi.io/node:22-slim synced to:"
          echo "  tenant-1 (ECR, AWS us-east-1):    <ECR_REGISTRY_TENANT_1>/dhi-runtime-node:22-slim"
          echo "  tenant-2 (GAR, GCP us-central1):  <GAR_REGISTRY_TENANT_2>/dhi-runtime-node:22-slim"
          echo "  tenant-3 (GAR, GCP europe-west1): <GAR_REGISTRY_TENANT_3>/dhi-runtime-node:22-slim"
          echo ""
          echo "Deploy workflows use: encore build docker --base=<registry>/dhi-runtime-node:22-slim"
